name: Build Coffee Roast APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="./CoffeeRoast_V5.4.1_STARTUP_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          rm -rf android_project
          mkdir android_project
          unzip -q "$ZIP_FILE" -d android_project

          SETTINGS_FILE=$(find android_project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android_project -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find android_project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          touch "$PROJECT_DIR/gradle.properties"
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        shell: bash
        run: |
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" CoffeeRoast_V5.4.1.apk
          echo "APK ready: CoffeeRoast_V5.4.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoast-V5.4.1-APK
          path: CoffeeRoast_V5.4.1.apk
          if-no-files-found: error
