name: Build Coffee Roast APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project
        run: |
          ZIP_FILE="./coffee_roast_android_v5_3_2_github.zip"
          if [ -z "$ZIP_FILE" ]; then
            echo "V5.3 ZIP not found"
            exit 1
          fi
          echo "Using $ZIP_FILE"
          rm -rf android_project
          mkdir android_project
          unzip -q "$ZIP_FILE" -d android_project
          echo "android.useAndroidX=true" > android_project/gradle.properties

      - name: Build APK
        run: gradle -p android_project :app:assembleDebug
      - name: Sign APK with permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > coffee-roast.jks
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks coffee-roast.jks \
            --ks-key-alias coffee_roast \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            android_project/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coffee-roast-v5.3-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
