name: Build Coffee Roast APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir android_project
          unzip -q coffee_roast_android_v5_2_github.zip -d android_project

      - name: Build APK
        run: gradle -p android_project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coffee-roast-v5.2-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
