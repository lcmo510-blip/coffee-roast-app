name: Build Coffee Roast APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project
        shell: bash
        run: |
          ZIP_FILE="./CoffeeRoast_V5.4_FULL_PROJECT.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V5.4 ZIP not found"
            ls -la
            exit 1
          fi

          echo "Using $ZIP_FILE"

          rm -rf android_project
          mkdir android_project
          unzip -q "$ZIP_FILE" -d android_project

          PROJECT_DIR=$(find android_project -type f -name "settings.gradle" -o -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found"
            find android_project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        shell: bash
        run: |
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Sign APK with permanent key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > coffee-roast.keystore

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

            "$APKSIGNER" sign \
              --ks coffee-roast.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              --out CoffeeRoast_V5.4.apk \
              "$APK"
