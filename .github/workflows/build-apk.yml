name: Build Coffee Roast APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="./CoffeeRoast_V5.4.14_BACKUP_WRITE_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          rm -rf android_project
          mkdir android_project
          unzip -q "$ZIP_FILE" -d android_project

          SETTINGS_FILE=$(find android_project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android_project -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find android_project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          touch "$PROJECT_DIR/gradle.properties"
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        shell: bash
        run: |
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Sign APK with permanent key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > coffee-roast-release.jks

          keytool -list \
            -keystore coffee-roast-release.jks \
            -storepass "$KEYSTORE_PASSWORD"

          KEY_ALIAS=$(keytool -list \
            -keystore coffee-roast-release.jks \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -E 'PrivateKeyEntry|private key entry' \
            | head -n 1 \
            | cut -d',' -f1 \
            | xargs)

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Could not determine key alias"
            exit 1
          fi

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools not found"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks coffee-roast-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out CoffeeRoast_V5.4.14.apk \
            "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            CoffeeRoast_V5.4.14.apk

          echo "V5.4.14 signature verification PASSED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoast-V5.4.14-SIGNED-APK
          path: CoffeeRoast_V5.4.14.apk
          if-no-files-found: error
